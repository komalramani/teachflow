<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TeachFlow</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <h1>TeachFlow</h1>
    <p>Educator Productivity Dashboard</p>
  </header>

  <main>
  <section class="dashboard">
    <section id="task-form-section" class="task-form-section hidden">
  <div class="form-header">
    <div>
      <p class="section-label">New Task</p>
      <h2 id="form-title">Add Teaching Task</h2>
    </div>

    <button
      id="close-form-button"
      class="secondary-button"
      type="button"
    >
      Cancel
    </button>
  </div>

  <form id="task-form">
    <div class="form-grid">
      <label>
        Task Title
        <input
          type="text"
          id="task-title"
          required
        >
      </label>

      <label>
        Subject or Class
        <input
          type="text"
          id="task-subject"
          required
        >
      </label>

      <label>
        Due Date
        <input
          type="date"
          id="task-due-date"
          required
        >
      </label>

      <label>
        Priority
        <select id="task-priority" required>
          <option value="">Select priority</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </label>

      <label>
        Status
        <select id="task-status" required>
          <option value="pending">Pending</option>
          <option value="completed">Completed</option>
        </select>
      </label>
    </div>

    <button id="save-task-button" type="submit">
  Save Task
</button>
  </form>
</section>
    <div class="dashboard-heading">
      <div>
        <p class="section-label">Overview</p>
        <h2>Teaching Dashboard</h2>
        <p>
          Track your teaching tasks, deadlines and progress.
        </p>
      </div>

      <button id="add-task-button">Add Task</button>
    </div>

    <div class="summary-grid">
      <article class="summary-card">
        <p>Total Tasks</p>
        <h3 id="total-tasks">0</h3>
      </article>

      <article class="summary-card">
        <p>Pending</p>
        <h3 id="pending-tasks">0</h3>
      </article>

      <article class="summary-card">
        <p>Completed</p>
        <h3 id="completed-tasks">0</h3>
      </article>
    </div>

    <section class="task-section">
  <h2>Teaching Tasks</h2>

  <div id="task-list" class="task-list">
    <p id="empty-message">
      No tasks added yet. Click “Add Task” to begin.
    </p>
  </div>
</section>
  </section>
</main>

  <footer>
    <p>Built by Komal Ramani</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
